<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 722" role="img" aria-label="Animated monogram loading indicator">
  <title>Monogram loader</title>
  <style>
    .mark {
      fill: #000;
      fill-rule: evenodd;
      stroke: currentColor;
      stroke-width: 1.2;
      stroke-linejoin: round;
      stroke-linecap: square;
      pathLength: 1000;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: trace 2.4s cubic-bezier(.65,0,.25,1) infinite;
    }
    @keyframes trace {
      0% { stroke-dashoffset: 1000; fill-opacity: 0; }
      58% { stroke-dashoffset: 0; fill-opacity: 0; }
      72%, 88% { stroke-dashoffset: 0; fill-opacity: 1; }
      100% { stroke-dashoffset: -1000; fill-opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
    }
  </style>
